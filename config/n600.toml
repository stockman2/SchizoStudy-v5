# Промежуточный конфиг: 600 наборов. Всё остальное — как в base.toml.

[sets]
K = 200000        # сколько наборов параметров разыграть
nsel = 600        # середина: SE около 10 %, прогон «все правила» около часа
seed = 83
q = 0.10          # положение средней нагрузки в окне

[run]
days = 60
M = 1600          # шагов на сутки
J = 32            # клеток в популяции; закреплённая сетка уязвимости привязана к 32
warm = 16         # разгон, суток
seed = 4242
nproc = 0         # 0 — все ядра
out = "out"

[noise]
sigma = 0.08      # быстрый шум на логарифме нагрузки
tauc = 0.3        # его время корреляции, в единицах T
sigs = 0.0        # медленный шум: РАБОЧЕЕ значение ноль
tslow = 5.0
slpn = 0.24       # шум притока к сонному ядру, мВ

[model]
sigv = 0.10       # разброс уязвимости клеток
kd = 2.0          # связь «повреждение мешает заснуть», мВ
usedm = 1.0       # связь через среднее повреждение
taus = 2.625      # вторая ступень защиты, сутки (63 ч)
vfix = 1.0        # сетка уязвимости: закреплённый диапазон

[cache]
dir = "cache"
