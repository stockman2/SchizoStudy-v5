# Базовый конфиг. Рабочее положение на 14.10.2026: медленный шум нагрузки ВЫКЛЮЧЕН
# (sigs = 0) — его обоснование снято дважды, см. Ф6(в) и Ф18.

[sets]
K = 200000        # сколько наборов параметров разыграть
nsel = 2400       # 17.10: поднято с 2000. Причина: Ф23(б) упёрлась в проверку на
                  # опровержимость с перевесом 0,7 % — допуск 3 SE = 0,02652 против половины размаха
                  # 0,02633. Нужно SE не выше 0,00878 вместо 0,00944, то есть 2315 наборов.
                  # SE большинства величин падает как 1/sqrt(nsel). ЦЕНА прогона «все правила»
                  # смотреть через python run.py --rules all --dry
seed = 83
q = 0.10          # положение средней нагрузки в окне

[run]
days = 60
M = 1600          # шагов на сутки
J = 32            # клеток в популяции; закреплённая сетка уязвимости привязана к 32
warm = 16         # разгон, суток
seed = 4242
nproc = 0         # 0 — все ядра
out = "out"

[noise]
sigma = 0.08      # быстрый шум на логарифме нагрузки
tauc = 0.3        # его время корреляции, в единицах T
sigs = 0.0        # медленный шум: РАБОЧЕЕ значение ноль
tslow = 5.0
slpn = 0.24       # шум притока к сонному ядру, мВ

[model]
sigv = 0.10       # разброс уязвимости клеток
kd = 2.0          # связь «повреждение мешает заснуть», мВ
usedm = 1.0       # связь через среднее повреждение
taus = 2.625      # вторая ступень защиты, сутки (63 ч)
vfix = 1.0        # сетка уязвимости: закреплённый диапазон

[cache]
dir = "cache"

[f10]
nsel = 150        # подвыборка полосы для регистратора эпизодов
days = 100        # внутринаборным связям нужно 5+ эпизодов на набор, а эпизод с промежутком ~10 суток
warm = 16
